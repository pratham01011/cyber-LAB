<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none">
  <!-- Glowing dropshadow filter -->
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M12 2L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-3z" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
  <!-- Inner cyber element (shield lock/core) -->
  <path d="M12 11a2.5 2.5 0 100 5 2.5 2.5 0 000-5z" fill="#7f00ff" filter="url(#neon-glow)"/>
  <path d="M12 7v4" stroke="#d946ef" stroke-width="2" stroke-linecap="round" filter="url(#neon-glow)"/>
</svg>
